{% extends 'base.html' %}

{% block title %}Add Contact{% endblock %}

{% block content %}
<h2>Add New Contact</h2>
<div class="row">
    <div class="col-md-6 mt-3">
        <form method="POST" action="{{ url_for('create') }}">
            <div class="mb-3">
                <label for="name" class="form-label">Name *</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ name or '' }}" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number *</label>
                <input type="text" class="form-control" id="phone" name="phone" value="{{ phone or '' }}" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}">
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <textarea class="form-control" id="address" name="address" rows="3">{{ address or '' }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save Contact</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
