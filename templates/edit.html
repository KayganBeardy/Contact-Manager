{% extends 'base.html' %}

{% block title %}Edit Contact{% endblock %}

{% block content %}
<h2>Edit Contact: {{ contact.name }}</h2>
<div class="row">
    <div class="col-md-6 mt-3">
        <form method="POST" action="{{ url_for('edit', id=contact.id) }}">
            <div class="mb-3">
                <label for="name" class="form-label">Name *</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ contact.name }}" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number *</label>
                <input type="text" class="form-control" id="phone" name="phone" value="{{ contact.phone }}" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ contact.email or '' }}">
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <textarea class="form-control" id="address" name="address" rows="3">{{ contact.address or '' }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Update Contact</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
