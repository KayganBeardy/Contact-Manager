{% extends 'base.html' %}

{% block title %}View Contact{% endblock %}

{% block content %}
<h2>Contact Details</h2>
<div class="card mt-3" style="max-width: 500px;">
    <div class="card-header bg-dark text-white">
        {{ contact.name }}
    </div>
    <div class="card-body">
        <p><strong>Phone:</strong> {{ contact.phone }}</p>
        <p><strong>Email:</strong> {{ contact.email or 'N/A' }}</p>
        <p><strong>Address:</strong><br> {{ contact.address or 'N/A' }}</p>
    </div>
    <div class="card-footer">
        <a href="{{ url_for('edit', id=contact.id) }}" class="btn btn-warning">Edit</a>
        <form action="{{ url_for('delete', id=contact.id) }}" method="POST" style="display:inline;">
            <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this contact?');">Delete</button>
        </form>
        <a href="{{ url_for('index') }}" class="btn btn-secondary float-end">Back to List</a>
    </div>
</div>
{% endblock %}
